<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Interactive Activities</title>
<style>
  :root { --teal:#00838f; --teal-dark:#00606b; --teal-tint:#e4f2f3; --ink:#26343a; }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px 14px 40px; background:#f4f7f7; color:var(--ink); font:16px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  main { max-width:860px; margin:0 auto; }
  .header-logo { display:block; margin:0 auto 18px; max-width:100%; height:auto; }
  h1 { font-size:1.35rem; color:var(--teal-dark); border-bottom:3px solid var(--teal); padding-bottom:8px; margin:0 0 6px; }
  p.lead { margin:0 0 24px; color:#4a5a60; font-size:.95rem; }
  ul.links { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
  ul.links a { display:flex; align-items:center; padding:12px 14px; background:var(--teal-tint); border:1px solid #bcd9dc; border-radius:8px; color:var(--teal-dark); font-weight:600; text-decoration:none; }
  ul.links a:hover, ul.links a:focus-visible { background:var(--teal); border-color:var(--teal); color:#fff; outline:none; }
  ul.links a::after { content:"\2192"; font-weight:400; opacity:.65; margin-left:auto; }
</style>
</head>
<body>
<main>
  <svg class="header-logo" viewBox="0 0 500 281" width="500" height="281" role="img" aria-label="Interactive Activities" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00838f"/><stop offset="1" stop-color="#00606b"/></linearGradient></defs>
    <rect width="500" height="281" rx="18" fill="url(#hg)"/>
    <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".95">
      <rect x="60" y="48" width="86" height="62" rx="9"/><path d="M78 68h50M78 84h34"/>
      <rect x="354" y="48" width="86" height="62" rx="9"/><circle cx="380" cy="79" r="9"/><path d="M400 72h24M400 88h16"/>
    </g>
    <g transform="translate(228 70)">
      <path d="M0 0v70l19-17 13 30 12-6-13-29 26-1z" fill="#fff" stroke="#00606b" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <text x="250" y="204" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="40" font-weight="700" fill="#fff">Interactive Activities</text>
    <text x="250" y="238" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="20" fill="#e4f2f3">Learn · Practise · Play</text>
  </svg>
  <h1>English Interactive Activities</h1>
  <p class="lead">Choose an activity collection.</p>
  <ul class="links">
    <li><a href="WordWall/">Wordwall Vocabulary Activities (A2+ Fall)</a></li>
    <li><a href="BookWidgets/">BookWidgets Vocabulary Activities (A2+ Fall)</a></li>
  </ul>
</main>
</body>
</html>
