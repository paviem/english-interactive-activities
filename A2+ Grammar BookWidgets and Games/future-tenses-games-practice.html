<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Future Tenses — Games & Practice</title>
<style>
  :root {
    --teal: #00838f;
    --teal-dark: #00606b;
    --teal-tint: #e4f2f3;
    --ink: #26343a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 14px 40px;
    background: #f4f7f7;
    color: var(--ink);
    font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; }
  img.header { display: block; height: 46px; width: auto; max-width: 100%; margin: 0 0 16px; }
  h1 {
    font-size: 1.35rem;
    color: var(--teal-dark);
    border-bottom: 3px solid var(--teal);
    padding-bottom: 8px;
    margin: 0 0 6px;
  }
  p.lead { margin: 0 0 24px; color: #4a5a60; font-size: .95rem; }
  section {
    background: #fff;
    border: 1px solid #d5e2e4;
    border-radius: 10px;
    padding: 18px 20px 22px;
    margin-bottom: 24px;
  }
  ul.activities {
    list-style: none;
    margin: 0; padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
  }
  ul.activities a {
    display: block;
    padding: 11px 14px;
    background: var(--teal-tint);
    border: 1px solid #bcd9dc;
    border-radius: 8px;
    color: var(--teal-dark);
    font-weight: 600;
    text-decoration: none;
  }
  ul.activities a .icon { margin-right: 8px; }
  ul.activities a:hover,
  ul.activities a:focus-visible {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
    outline: none;
  }
  ul.activities a::after { content: " ↗"; font-weight: 400; opacity: .65; }
  footer { text-align: center; color: #7c8d93; font-size: .8rem; }
</style>
</head>
<body>
<main>
  <img class="header" src="wordwall-header.jpg" alt="Wordwall">
  <h1>Future Tenses — Games &amp; Practice</h1>
  <p class="lead">Choose an activity below to practise future tenses. Each one opens in a new tab — work through them at your own pace.</p>

  <section>
    <ul class="activities">
      <li><a href="https://wordwall.net/resource/13917444/go-getter-4-going-to/going" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">🎯</span>Going To — Matching Game</a></li>
      <li><a href="https://wordwall.net/resource/3041795/english/vs-going" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">🔀</span>Will vs Going To</a></li>
    </ul>
  </section>

  <footer>Future Tenses · Games &amp; Practice · 2 activities</footer>
</main>
</body>
</html>
